name: ci

on:
  # Only main on push — `pull_request` already covers branch work, and matching
  # every branch here would run the whole suite twice for each PR push.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Verify generated artifacts are reproducible
        run: |
          npm run build
          git diff --exit-code -- wasm/ antidebug.js integrity.json \
            || (echo "::error::Generated artifacts are stale — run 'npm run build' and commit." && exit 1)

      - name: Run the suite
        run: npx playwright test

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
